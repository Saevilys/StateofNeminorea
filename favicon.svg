<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#1a1430"/>
  <!-- two doves facing each other, pixel style -->
  <g fill="#7fd9c8" shape-rendering="crispEdges">
    <!-- left dove -->
    <rect x="14" y="20" width="6" height="2"/>
    <rect x="12" y="22" width="10" height="2"/>
    <rect x="10" y="24" width="12" height="4"/>
    <rect x="12" y="28" width="8" height="2"/>
    <rect x="14" y="30" width="4" height="2"/>
    <!-- right dove (mirror) -->
    <rect x="44" y="20" width="6" height="2"/>
    <rect x="42" y="22" width="10" height="2"/>
    <rect x="42" y="24" width="12" height="4"/>
    <rect x="44" y="28" width="8" height="2"/>
    <rect x="46" y="30" width="4" height="2"/>
    <!-- beaks touching -->
    <rect x="22" y="22" width="4" height="2" fill="#e8c878"/>
    <rect x="38" y="22" width="4" height="2" fill="#e8c878"/>
    <!-- glow center -->
    <rect x="26" y="24" width="12" height="4" fill="#e8c878" opacity="0.4"/>
  </g>
  <!-- stars -->
  <g fill="#e8c878" shape-rendering="crispEdges">
    <rect x="8" y="12" width="1" height="1"/>
    <rect x="54" y="14" width="1" height="1"/>
    <rect x="32" y="8" width="1" height="1"/>
    <rect x="20" y="40" width="1" height="1"/>
    <rect x="44" y="42" width="1" height="1"/>
  </g>
</svg>
